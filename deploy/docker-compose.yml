# Quiz platform on its own server: the app plus Caddy, which gets and renews the HTTPS
# certificate by itself. Settings live in .env (copy .env.example). Install: ./install.sh
name: quiz

services:
  quiz:
    build: ..
    restart: unless-stopped
    env_file: .env
    environment:
      QUIZ_DATA: /data
    volumes:
      - quiz-data:/data
    mem_limit: 1g

  caddy:
    image: caddy:2.8.4-alpine
    restart: unless-stopped
    depends_on:
      - quiz
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  quiz-data:     # database, uploaded images, logo, backups
  caddy-data:    # certificates
  caddy-config:
