# For servers that already run nginx (instead of the bundled Caddy).
# Start only the app:  docker compose up -d quiz  and publish its port, e.g. add to the quiz
# service in docker-compose.yml:   ports: ["127.0.0.1:8000:8000"]
# Then add this server block, with your own domain and certificate paths.

limit_req_zone $binary_remote_addr zone=quiz:10m rate=100r/s;   # in the http { } block

server {
    listen 443 ssl;
    http2 on;
    server_name quiz.example.org;

    ssl_certificate     /etc/letsencrypt/live/quiz.example.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/quiz.example.org/privkey.pem;

    add_header Strict-Transport-Security "max-age=31536000" always;

    # A whole class often shares one campus address, so allow plenty of requests per address.
    limit_req zone=quiz burst=600 nodelay;
    client_max_body_size 11m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_http_version 1.1;

    # Live games: one WebSocket per player, open for the whole game.
    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3h;
        proxy_send_timeout 3h;
    }

    # AI question writing: material files up to 50 MB, answers can take a few minutes.
    location /api/ai/ {
        client_max_body_size 51m;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
    }

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}

server {
    listen 80;
    server_name quiz.example.org;
    return 301 https://$host$request_uri;
}
