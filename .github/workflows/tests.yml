name: tests

on:
  push:
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt pytest
      - run: pytest -q

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the container and check it starts
        run: |
          docker build -t quiz-platform .
          docker run -d --name quiz -e QUIZ_SECURE_COOKIE=0 -p 8000:8000 quiz-platform
          for i in $(seq 30); do curl -fs http://127.0.0.1:8000/healthz && break; sleep 1; done
          curl -fs http://127.0.0.1:8000/api/me
          docker logs quiz
